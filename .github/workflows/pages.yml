name: Deploy CMMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static frontend only
        run: |
          mkdir site
          cp index.html login.html dashboard.html items.html warehouse.html reports.html work-detail.html account.html users.html supabase-import.html app.css data-manager.js login.js supabase-config.js site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
