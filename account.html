<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tài khoản của tôi - MyxTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <style>
      body { display:flex; min-height:100vh; height:100vh; overflow:hidden; }
      .sidebar { width:260px; background:var(--white); border-right:1px solid var(--border); display:flex; flex-direction:column; }
      .sidebar-logo { height:70px; display:flex; align-items:center; padding:0 24px; font-size:20px; font-weight:700; color:var(--primary); border-bottom:1px solid var(--border); gap:10px; text-decoration:none; }
      .logo-icon { width:28px; height:28px; background:var(--primary); border-radius:6px; position:relative; }
      .logo-icon::after { content:""; position:absolute; inset:7px; background:white; border-radius:3px; }
      .nav-menu { padding:20px 12px; flex:1; }
      .nav-item { display:flex; align-items:center; padding:12px 16px; color:var(--text-light); text-decoration:none; border-radius:8px; margin-bottom:4px; font-weight:500; gap:10px; }
      .nav-item.active { background:var(--primary-light); color:var(--primary); }
      .main-content { flex:1; display:flex; flex-direction:column; overflow-y:auto; }
      .topbar { height:70px; background:white; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; padding:0 30px; }
      .user-profile { display:flex; align-items:center; gap:12px; }
      .avatar { width:40px; height:40px; background:var(--primary); color:white; border-radius:50%; display:grid; place-items:center; font-weight:600; }
      .content-wrapper { padding:30px; max-width:1100px; margin:0 auto; width:100%; }
      .card { max-width:560px; background:white; border:1px solid var(--border); border-radius:14px; padding:24px; }
      .card h1 { font-size:24px; margin-bottom:8px; }
      .card p { color:var(--text-light); line-height:1.6; margin-bottom:20px; }
      .form-group { margin-bottom:16px; }
      .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:7px; }
      .form-group input { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; }
      .btn { background:var(--primary); color:white; border:0; border-radius:9px; min-height:42px; padding:10px 16px; font-weight:600; cursor:pointer; }
      .btn:disabled { opacity:.65; cursor:wait; }
      .message { min-height:20px; margin-top:12px; font-size:13px; }
      @media(max-width:768px) { body { display:block; height:auto; overflow:auto; } .sidebar { display:none; } .main-content { min-height:100vh; overflow:visible; } .topbar { padding:10px 16px; } .content-wrapper { padding:22px 16px 36px; } }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <a href="/dashboard.html" class="sidebar-logo"><span class="logo-icon"></span>MyxTech</a>
      <nav class="nav-menu" aria-label="Điều hướng chính">
        <a href="/dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i>Tổng quan</a>
        <a href="/items.html" class="nav-item"><i class="fa-solid fa-microchip"></i>Thiết bị</a>
        <a href="/warehouse.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i>Quản lý kho</a>
        <a href="/reports.html" class="nav-item"><i class="fa-solid fa-file-invoice"></i>Báo cáo</a>
        <a href="/account.html" class="nav-item active"><i class="fa-solid fa-user-gear"></i>Tài khoản của tôi</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <strong>Thiết lập tài khoản</strong>
        <div class="user-profile">
          <div class="avatar" id="userAvatar">U</div>
          <div><div id="userName" style="font-weight:600">Người dùng</div><div id="userEmail" style="font-size:12px;color:var(--text-light)"></div></div>
        </div>
      </header>
      <div class="content-wrapper">
        <section class="card">
          <h1>Đổi mật khẩu</h1>
          <p>Đổi mật khẩu đăng nhập. Sau khi cập nhật, các phiên đăng nhập khác của bạn sẽ bị thu hồi.</p>
          <form id="passwordForm">
            <div class="form-group"><label for="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" type="password" autocomplete="current-password" maxlength="256" required /></div>
            <div class="form-group"><label for="newPassword">Mật khẩu mới</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required /><small>Tối thiểu 12 ký tự.</small></div>
            <div class="form-group"><label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required /></div>
            <button type="submit" class="btn" id="changePasswordButton">Cập nhật mật khẩu</button>
            <p id="passwordMessage" class="message" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>
    <script>
      "use strict";
      document.getElementById("passwordForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = document.getElementById("changePasswordButton");
        const message = document.getElementById("passwordMessage");
        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        if (newPassword !== document.getElementById("confirmPassword").value) {
          message.style.color = "var(--danger)";
          message.textContent = "Mật khẩu nhập lại không khớp.";
          return;
        }
        button.disabled = true;
        message.textContent = "";
        try {
          await MyxTech.User.changePassword(currentPassword, newPassword);
          form.reset();
          message.style.color = "var(--success)";
          message.textContent = "Đã đổi mật khẩu. Các phiên đăng nhập khác đã bị thu hồi.";
        } catch (error) {
          message.style.color = "var(--danger)";
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
      document.addEventListener("DOMContentLoaded", () => {
        MyxTech.init().catch((error) => alert(error.message));
      });
    </script>
    <script src="supabase-config.js"></script>
    <script src="data-manager.js"></script>
  </body>
</html>
